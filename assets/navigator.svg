<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2AE2E"/>
      <stop offset="1" stop-color="#D9860A"/>
    </linearGradient>
    <linearGradient id="tab2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C35A"/>
      <stop offset="1" stop-color="#E59A1C"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFDD78"/>
      <stop offset="1" stop-color="#FBBA35"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA8FF"/>
      <stop offset="1" stop-color="#005FB8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Retro della cartella con due linguette: le schede -->
    <path d="M22 60 a14 14 0 0 1 14-14 h46 a12 12 0 0 1 9 4 l12 14 h11 V60 a14 14 0 0 1 14-14 h40 a12 12 0 0 1 9 4 l12 14 h31 a14 14 0 0 1 14 14 v118 a14 14 0 0 1 -14 14 H36 a14 14 0 0 1 -14-14 z"
          fill="url(#back)"/>
    <path d="M114 60 a14 14 0 0 1 14-14 h40 a12 12 0 0 1 9 4 l12 14 H114 z" fill="url(#tab2)"/>
    <!-- Fogli -->
    <rect x="40" y="70" width="176" height="60" rx="6" fill="#FFFFFF"/>
    <rect x="52" y="80" width="88" height="6" rx="3" fill="#D6DEE8"/>
    <!-- Fronte della cartella -->
    <path d="M18 104 a14 14 0 0 1 14-14 h192 a14 14 0 0 1 14 14 v96 a14 14 0 0 1 -14 14 H32 a14 14 0 0 1 -14-14 z"
          fill="url(#front)"/>
    <path d="M18 104 a14 14 0 0 1 14-14 h192 a14 14 0 0 1 14 14 v10 H18 z" fill="#FFFFFF" opacity="0.25"/>
  </g>

  <!-- Freccia di navigazione: il "navigatore" -->
  <g filter="url(#shadow)">
    <circle cx="184" cy="182" r="58" fill="#FFFFFF"/>
    <circle cx="184" cy="182" r="50" fill="url(#blue)"/>
    <circle cx="184" cy="182" r="50" fill="url(#glow)"/>
  </g>
  <path d="M184 146 L212 214 L184 199 L156 214 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"
        transform="rotate(30 184 182)"/>
</svg>
